<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diabetic Dash — Setup</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Diabetic Dash</h1>
    <p class="subtitle">Configure your dashboard</p>
  </header>

  <form id="form" autocomplete="off">

    <section>
      <h2>CGM Source</h2>
      <label>
        Data source
        <select name="cgm_source" id="cgm-source-select">
          <option value="0">Dexcom Share</option>
          <option value="1">Nightscout</option>
        </select>
      </label>
    </section>

    <section>
      <h2>WiFi</h2>
      <label>
        Network name (SSID)
        <input name="wifi_ssid" type="text" autocomplete="off" spellcheck="false">
      </label>
      <label>
        Password
        <input name="wifi_password" type="password" autocomplete="new-password"
               placeholder="Leave blank to keep current">
      </label>
    </section>

    <section id="dexcom-section">
      <h2>Dexcom Share</h2>
      <label>
        Dexcom username
        <input name="dexcom_username" type="text" autocomplete="off">
      </label>
      <label>
        Dexcom password
        <input name="dexcom_password" type="password" autocomplete="new-password"
               placeholder="Leave blank to keep current">
      </label>
      <label>
        Region
        <select name="dexcom_region_us">
          <option value="true">United States</option>
          <option value="false">Outside United States</option>
        </select>
      </label>
    </section>

    <section id="nightscout-section" style="display:none">
      <h2>Nightscout</h2>
      <label>
        Nightscout URL
        <input name="nightscout_url" type="url" autocomplete="off"
               placeholder="https://mysite.fly.dev">
      </label>
      <label>
        API secret
        <input name="nightscout_secret" type="password" autocomplete="new-password"
               placeholder="Leave blank if no auth / to keep current">
      </label>
      <p class="hint">xDrip+, Dexcom Share bridge, and Libre all push to Nightscout.
        Enable the REST API in your Nightscout settings.</p>
    </section>

    <section>
      <h2>Display</h2>
      <label>
        Timezone
        <select name="timezone">
          <option value="UTC0">UTC</option>
          <optgroup label="United States">
            <option value="EST5EDT,M3.2.0,M11.1.0">Eastern (ET)</option>
            <option value="CST6CDT,M3.2.0,M11.1.0">Central (CT)</option>
            <option value="MST7MDT,M3.2.0,M11.1.0">Mountain (MT)</option>
            <option value="MST7">Mountain – Arizona (no DST)</option>
            <option value="PST8PDT,M3.2.0,M11.1.0">Pacific (PT)</option>
            <option value="AKST9AKDT,M3.2.0,M11.1.0">Alaska (AKT)</option>
            <option value="HST10">Hawaii (HST)</option>
          </optgroup>
          <optgroup label="Europe">
            <option value="GMT0BST,M3.5.0/1,M10.5.0">London (GMT/BST)</option>
            <option value="CET-1CEST,M3.5.0,M10.5.0/3">Central Europe (CET)</option>
            <option value="EET-2EEST,M3.5.0/3,M10.5.0/4">Eastern Europe (EET)</option>
          </optgroup>
          <optgroup label="Asia / Pacific">
            <option value="IST-5:30">India (IST)</option>
            <option value="CST-8">China / HK / Singapore (CST)</option>
            <option value="JST-9">Japan / Korea (JST)</option>
            <option value="AEST-10AEDT,M10.1.0,M4.1.0/3">Australia Eastern (AEST)</option>
            <option value="NZST-12NZDT,M9.5.0,M4.1.0/3">New Zealand (NZST)</option>
          </optgroup>
        </select>
      </label>
      <label>
        Glucose units
        <select name="unit_mgdl">
          <option value="true">mg/dL</option>
          <option value="false">mmol/L</option>
        </select>
      </label>
      <div class="row">
        <label>
          Low (red)
          <input name="glucose_low" type="number" min="40" max="400" step="1">
        </label>
        <label>
          Warn low (yellow)
          <input name="glucose_warn_low" type="number" min="40" max="400" step="1">
        </label>
      </div>
      <div class="row">
        <label>
          Warn high (yellow)
          <input name="glucose_warn_high" type="number" min="40" max="400" step="1">
        </label>
        <label>
          High (red)
          <input name="glucose_high" type="number" min="40" max="400" step="1">
        </label>
      </div>
    </section>

    <button type="submit">Save &amp; Restart</button>
  </form>

  <button type="button" id="reset-btn" class="danger">Factory Reset</button>
  <a href="/update" id="update-link">Update firmware</a>

  <p id="status" aria-live="polite"></p>

  <script>
    const status = document.getElementById('status');
    const sourceSelect = document.getElementById('cgm-source-select');

    function setStatus(msg, isError) {
      status.textContent = msg;
      status.className = isError ? 'error' : 'success';
    }

    function applySourceVisibility(val) {
      document.getElementById('dexcom-section').style.display   = val === '0' ? '' : 'none';
      document.getElementById('nightscout-section').style.display = val === '1' ? '' : 'none';
    }

    sourceSelect.addEventListener('change', e => applySourceVisibility(e.target.value));

    // Populate form with current config on load (passwords excluded).
    fetch('/config')
      .then(r => r.json())
      .then(cfg => {
        for (const [key, val] of Object.entries(cfg)) {
          const el = document.querySelector(`[name="${key}"]`);
          if (el) el.value = val;
        }
        applySourceVisibility(String(cfg.cgm_source ?? 0));
      })
      .catch(() => setStatus('Could not load current config.', true));

    document.getElementById('form').addEventListener('submit', e => {
      e.preventDefault();
      const data = {};
      new FormData(e.target).forEach((val, key) => {
        if (['glucose_low','glucose_high','glucose_warn_low','glucose_warn_high',
             'cgm_source'].includes(key)) {
          data[key] = parseInt(val, 10);
        } else if (['dexcom_region_us', 'unit_mgdl'].includes(key)) {
          data[key] = val === 'true';
        } else {
          data[key] = val;
        }
      });

      setStatus('Saving…', false);

      fetch('/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
        .then(r => r.json())
        .then(r => {
          if (r.ok) {
            setStatus('Saved! Device is restarting…', false);
          } else {
            setStatus('Error: ' + (r.error || 'unknown'), true);
          }
        })
        .catch(() => setStatus('Request failed.', true));
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      if (!confirm('Reset all settings? The device will return to setup mode.')) return;
      fetch('/reset', { method: 'POST' })
        .then(() => setStatus('Reset! Connect to DiabeticDash-Setup WiFi.', false))
        .catch(() => setStatus('Reset request failed.', true));
    });
  </script>
</body>
</html>
