<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diabetic Dash — Setup</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Diabetic Dash</h1>
    <p class="subtitle">Configure your dashboard</p>
  </header>

  <form id="form" autocomplete="off">

    <section>
      <h2>WiFi</h2>
      <label>
        Network name (SSID)
        <input name="wifi_ssid" type="text" autocomplete="off" spellcheck="false">
      </label>
      <label>
        Password
        <input name="wifi_password" type="password" autocomplete="new-password"
               placeholder="Leave blank to keep current">
      </label>
    </section>

    <section>
      <h2>Dexcom</h2>
      <label>
        Dexcom username (email)
        <input name="dexcom_username" type="email" autocomplete="off">
      </label>
      <label>
        Dexcom password
        <input name="dexcom_password" type="password" autocomplete="new-password"
               placeholder="Leave blank to keep current">
      </label>
      <label>
        Region
        <select name="dexcom_region_us">
          <option value="true">United States</option>
          <option value="false">Outside United States</option>
        </select>
      </label>
    </section>

    <section>
      <h2>Display</h2>
      <label>
        Glucose units
        <select name="unit_mgdl">
          <option value="true">mg/dL</option>
          <option value="false">mmol/L</option>
        </select>
      </label>
      <div class="row">
        <label>
          Low (red)
          <input name="glucose_low" type="number" min="40" max="400" step="1">
        </label>
        <label>
          Warn low (yellow)
          <input name="glucose_warn_low" type="number" min="40" max="400" step="1">
        </label>
      </div>
      <div class="row">
        <label>
          Warn high (yellow)
          <input name="glucose_warn_high" type="number" min="40" max="400" step="1">
        </label>
        <label>
          High (red)
          <input name="glucose_high" type="number" min="40" max="400" step="1">
        </label>
      </div>
    </section>

    <button type="submit">Save &amp; Restart</button>
  </form>

  <button type="button" id="reset-btn" class="danger">Factory Reset</button>

  <p id="status" aria-live="polite"></p>

  <script>
    const status = document.getElementById('status');

    function setStatus(msg, isError) {
      status.textContent = msg;
      status.className = isError ? 'error' : 'success';
    }

    // Populate form with current config on load (passwords excluded).
    fetch('/config')
      .then(r => r.json())
      .then(cfg => {
        for (const [key, val] of Object.entries(cfg)) {
          const el = document.querySelector(`[name="${key}"]`);
          if (el) el.value = val;
        }
      })
      .catch(() => setStatus('Could not load current config.', true));

    document.getElementById('form').addEventListener('submit', e => {
      e.preventDefault();
      const data = {};
      new FormData(e.target).forEach((val, key) => {
        if (['glucose_low','glucose_high','glucose_warn_low','glucose_warn_high'].includes(key)) {
          data[key] = parseInt(val, 10);
        } else if (['dexcom_region_us', 'unit_mgdl'].includes(key)) {
          data[key] = val === 'true';
        } else {
          data[key] = val;
        }
      });

      setStatus('Saving…', false);

      fetch('/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
        .then(r => r.json())
        .then(r => {
          if (r.ok) {
            setStatus('Saved! Device is restarting…', false);
          } else {
            setStatus('Error: ' + (r.error || 'unknown'), true);
          }
        })
        .catch(() => setStatus('Request failed.', true));
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      if (!confirm('Reset all settings? The device will return to setup mode.')) return;
      fetch('/reset', { method: 'POST' })
        .then(() => setStatus('Reset! Connect to DiabeticDash-Setup WiFi.', false))
        .catch(() => setStatus('Reset request failed.', true));
    });
  </script>
</body>
</html>
