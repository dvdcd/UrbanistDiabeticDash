<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diabetic Dash Simulator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #111;
      color: #e0e0e0;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 24px;
      padding: 20px;
      min-height: 100vh;
    }
    section {
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 14px;
    }
    h1 { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
    .subtitle { font-size: 13px; color: #666; margin-top: 2px; margin-bottom: 16px; }
    h2 {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.8px; color: #555; margin-bottom: 14px;
    }
    label { display: block; font-size: 13px; color: #999; margin-bottom: 12px; }
    label:last-child { margin-bottom: 0; }
    input, select {
      display: block; width: 100%; margin-top: 5px;
      padding: 9px 11px; background: #2a2a2a; border: 1px solid #383838;
      border-radius: 6px; color: #eee; font-size: 15px;
      outline: none; transition: border-color 0.15s;
    }
    input:focus, select:focus { border-color: #3b82f6; }
    .row { display: flex; gap: 10px; }
    .row label { flex: 1; }
    button {
      display: block; width: 100%; padding: 12px; margin-bottom: 10px;
      background: #2563eb; color: #fff; border: none; border-radius: 8px;
      font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.15s;
    }
    button:hover { background: #1d4ed8; }
    button.secondary {
      background: #1e3a5f; color: #7af; font-weight: 400; font-size: 13px;
    }
    button.secondary:hover { background: #1a4a7a; }
    .hint { font-size: 12px; color: #555; margin-top: 10px; line-height: 1.5; }
    #display-col { flex-shrink: 0; }
    #display-frame {
      background: #000; border: 3px solid #2a2a2a;
      border-radius: 4px; display: inline-block; padding: 10px;
    }
    canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
    #fps-ver { color: #444; font-size: 11px; font-family: monospace; margin-top: 6px; }
    #controls {
      width: 480px; max-height: calc(100vh - 40px);
      overflow-y: auto; padding-right: 4px; padding-bottom: 20px;
      scrollbar-width: thin; scrollbar-color: #333 #111;
    }
    header { margin-bottom: 16px; }
    .toggles { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
    .toggle {
      padding: 7px 13px; background: #2a2a2a; border: 1px solid #383838;
      border-radius: 6px; color: #777; cursor: pointer; font-size: 13px;
      font-family: inherit; transition: all .1s; width: auto; margin-bottom: 0;
    }
    .toggle.on { background: #0d2a1a; border-color: #2a7; color: #3db; }
    .trend-grid {
      display: grid; grid-template-columns: repeat(4,1fr);
      gap: 6px; margin-top: 5px;
    }
    .trend-btn {
      padding: 7px 4px; background: #2a2a2a; border: 1px solid #383838;
      border-radius: 6px; color: #777; cursor: pointer; font-size: 12px;
      font-family: inherit; text-align: center; width: auto; margin-bottom: 0;
    }
    .trend-btn.active { background: #0d2a1a; border-color: #2a7; color: #3db; }
    .slider-row { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
    .slider-row input[type=range] { flex: 1; accent-color: #2563eb; }
    .slider-row input[type=number] { width: 80px; display: inline; margin-top: 0; }
    .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
    .preset-btn {
      padding: 7px 13px; background: #2a2a2a; border: 1px solid #383838;
      border-radius: 6px; cursor: pointer; font-size: 13px; font-family: inherit;
      width: auto; margin-bottom: 0; font-weight: 400; color: #eee;
    }
    .preset-btn:hover { background: #333; }
    input[type=color] { padding: 2px 4px; height: 36px; cursor: pointer; }
    #copy-toast { color: #3db; font-size: 11px; text-align: center; height: 16px; margin-top: 4px; }
    /* Noctiluca section */
    #noct-section { border-color: #1a3a4a; background: #0f1c22; }
    #noct-section h2 { color: #2a9aaa; letter-spacing: 1px; }
    #noct-section label { color: #7bb; }
    .noct-actions { display: flex; gap: 6px; margin-bottom: 10px; }
    .noct-actions button { margin-bottom: 0; padding: 7px; font-size: 12px; }
    .noct-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 5px 14px; margin-bottom: 12px;
    }
    .noct-grid label {
      display: flex; align-items: center; gap: 7px;
      font-size: 12px; color: #7bb; margin-bottom: 0; cursor: pointer;
    }
    .noct-grid input[type=checkbox] {
      width: auto; margin: 0; padding: 0; height: auto;
      accent-color: #2a9aaa; cursor: pointer;
    }
    .noct-sub {
      border-top: 1px solid #1a3a4a; margin-top: 12px; padding-top: 12px;
    }
    .cb-label {
      display: flex; align-items: center; gap: 8px; cursor: pointer; margin-bottom: 12px;
    }
    .cb-label input[type=checkbox] {
      width: auto; margin: 0; padding: 0; height: auto; accent-color: #2563eb;
    }
    .cb-label:last-child { margin-bottom: 0; }
  </style>
</head>
<body>

<div id="display-col">
  <div id="display-frame">
    <canvas id="c" width="768" height="192"></canvas>
  </div>
  <div id="fps-ver">fps: -- &nbsp;·&nbsp; v20260512-5afcb13</div>
</div>

<div id="controls">
  <header>
    <h1>Diabetic Dash</h1>
    <p class="subtitle">Simulator — v20260512-5afcb13</p>
  </header>

  <section>
    <h2>Simulator</h2>
    <label>
      Glucose (mg/dL)
      <div class="slider-row">
        <input type="range" id="glucose-range" min="40" max="400" value="112"
               oninput="onGlucoseRange(this.value)">
        <input type="number" id="glucose-num" min="40" max="400" value="112"
               oninput="onGlucoseNum(this.value)">
      </div>
    </label>
    <label>
      Trend
      <div class="trend-grid" id="trend-grid"></div>
    </label>
    <label>
      State
      <div class="toggles">
        <button class="toggle" id="t-stale"  onclick="toggleState('stale')">Stale</button>
        <button class="toggle" id="t-error"  onclick="toggleState('error')">Error</button>
        <button class="toggle" id="t-flip"   onclick="toggleState('flipped')">Flip</button>
      </div>
    </label>
    <label>
      Presets
      <div class="presets">
        <button class="preset-btn" style="color:#f77" onclick="setPreset(55,7)">Low ↓↓</button>
        <button class="preset-btn" style="color:#fb9" onclick="setPreset(75,6)">Warn ↓</button>
        <button class="preset-btn" style="color:#4db" onclick="setPreset(112,4)">Normal →</button>
        <button class="preset-btn" style="color:#fb9" onclick="setPreset(155,3)">Warn ↑</button>
        <button class="preset-btn" style="color:#f77" onclick="setPreset(220,1)">High ↑↑</button>
      </div>
    </label>
  </section>

  <section>
    <h2>Display</h2>
    <label class="cb-label">
      <input type="checkbox" name="unit_mgdl" checked>
      mg/dL units
    </label>
    <div class="row">
      <label>
        Low (red)
        <input name="glucose_low" type="number" min="40" max="400" step="1" value="70"
               oninput="cfg.glucose_low = +this.value">
      </label>
      <label>
        Warn low (yellow)
        <input name="glucose_warn_low" type="number" min="40" max="400" step="1" value="80"
               oninput="cfg.glucose_warn_low = +this.value">
      </label>
    </div>
    <div class="row">
      <label>
        Warn high (yellow)
        <input name="glucose_warn_high" type="number" min="40" max="400" step="1" value="160"
               oninput="cfg.glucose_warn_high = +this.value">
      </label>
      <label>
        High (red)
        <input name="glucose_high" type="number" min="40" max="400" step="1" value="180"
               oninput="cfg.glucose_high = +this.value">
      </label>
    </div>
  </section>

  <section>
    <h2>Style</h2>
    <label class="cb-label">
      <input type="checkbox" name="clock_24h"
             onchange="cfg.clock_24h=this.checked">
      24-hour clock
    </label>
    <label class="cb-label">
      <input type="checkbox" name="show_clock" checked
             onchange="cfg.show_clock=this.checked">
      Show clock
    </label>
    <label>
      Alert pulse speed
      <select name="pulse_speed" onchange="cfg.pulse_speed=+this.value">
        <option value="0">Very slow (0.25 Hz)</option>
        <option value="1" selected>Slow (0.5 Hz)</option>
        <option value="2">Normal (1 Hz)</option>
      </select>
    </label>
    <label>
      Alert pulse minimum brightness (%)
      <input name="pulse_min" type="number" min="0" max="90" step="5" value="50"
             oninput="cfg.pulse_min=+this.value">
    </label>
    <label class="cb-label">
      <input type="checkbox" name="show_sparkline" checked
             onchange="cfg.show_sparkline=this.checked">
      Show sparkline
    </label>
    <label class="cb-label">
      <input type="checkbox" name="sparkline_auto"
             onchange="cfg.sparkline_auto=this.checked">
      Auto-fit sparkline range
    </label>
    <label class="cb-label">
      <input type="checkbox" name="sparkline_shadow"
             onchange="cfg.sparkline_shadow=this.checked">
      Sparkline drop shadow
    </label>
    <label class="cb-label">
      <input type="checkbox" name="sparkline_fill"
             onchange="cfg.sparkline_fill=this.checked">
      Sparkline area fill
    </label>
    <label class="cb-label">
      <input type="checkbox" name="show_age" checked
             onchange="cfg.show_age=this.checked">
      Show reading age
    </label>
    <label class="cb-label">
      <input type="checkbox" name="show_status_label" checked
             onchange="cfg.show_status_label=this.checked">
      Show HI/LO label
    </label>
    <label class="cb-label">
      <input type="checkbox" name="auto_rotate">
      Auto-rotate (gyro)
    </label>
  </section>

  <section>
    <h2>Colors</h2>
    <div class="row">
      <label>
        Alert (low / high)
        <input name="color_low" type="color" value="#ff2200"
               oninput="cfg.color_low=parseInt(this.value.slice(1),16)">
      </label>
      <label>
        Warning threshold
        <input name="color_warn" type="color" value="#ffcc00"
               oninput="cfg.color_warn=parseInt(this.value.slice(1),16)">
      </label>
    </div>
    <div class="row" style="margin-top:10px">
      <label>
        In-range
        <input name="color_ok" type="color" value="#00cc44"
               oninput="cfg.color_ok=parseInt(this.value.slice(1),16)">
      </label>
    </div>
  </section>

  <!-- Noctiluca Theme -->
  <section id="noct-section">
    <h2>✦ Noctiluca Theme</h2>
    <div class="noct-actions">
      <button class="secondary" style="flex:1" onclick="setAllNoct(true)">Enable All</button>
      <button class="secondary" style="flex:1" onclick="setAllNoct(false)">Disable All</button>
    </div>
    <div class="noct-grid">
      <label><input type="checkbox" id="n-show_wave"    onchange="cfg.status_bar_style=this.checked?0:2"> Animated wave</label>
      <label><input type="checkbox" id="n-show_stars"   onchange="cfg.show_stars=this.checked"> Stars</label>
      <label><input type="checkbox" id="n-wave_enhanced"
                    onchange="noct.wave_enhanced=this.checked;document.getElementById('wave2-color-row').style.display=this.checked?'':'none'">
             Second wave color</label>
      <label><input type="checkbox" id="n-wave_tide"    onchange="noctTideChanged(this.checked)"> Tide = glucose zone</label>
      <label><input type="checkbox" id="n-boat_ride"    onchange="noctBoatChanged(this.checked)"> Boat on the waves</label>
      <label><input type="checkbox" id="n-boat_duck"   onchange="noctDuckChanged(this.checked)"> 🦆 Duck instead</label>
      <label><input type="checkbox" id="n-stars_tint"   onchange="noct.stars_tint=this.checked"> Star horizon tint</label>
      <label><input type="checkbox" id="n-aurora"       onchange="noct.aurora=this.checked"> Aurora</label>
      <label></label>
    </div>

    <!-- Tide aggressiveness — conditional -->
    <div id="tide-strength-row" style="display:none;margin-bottom:12px">
      <label style="color:#7bb;margin-bottom:0">
        Tide aggressiveness
        <div class="slider-row">
          <input type="range" name="tide_strength" min="0" max="100" value="75"
                 oninput="cfg.tide_strength=+this.value;document.getElementById('tide-str-num').value=this.value">
          <input type="number" id="tide-str-num" style="width:60px;margin-top:0;display:inline"
                 min="0" max="100" value="75"
                 oninput="cfg.tide_strength=+this.value;document.querySelector('[name=tide_strength]').value=this.value">
        </div>
      </label>
    </div>

    <!-- Second wave color — conditional -->
    <div id="wave2-color-row" style="display:none;margin-bottom:12px">
      <label style="color:#7bb;margin-bottom:0">
        Second wave color (deep)
        <input name="color_wave2" type="color" value="#0a0020"
               oninput="cfg.color_wave2=parseInt(this.value.slice(1),16)">
      </label>
    </div>

    <!-- Boat/duck colors — conditional -->
    <div id="boat-colors-row" style="display:none;margin-bottom:12px">
      <div class="row">
        <label style="color:#7bb">
          <span id="boat-hull-label">Hull color</span>
          <input name="color_boat_hull" type="color" value="#c87828"
                 oninput="cfg.color_boat_hull=parseInt(this.value.slice(1),16)">
        </label>
        <label style="color:#7bb">
          <span id="boat-sail-label">Sail color</span>
          <input name="color_boat_sail" type="color" value="#aa8c3c"
                 oninput="cfg.color_boat_sail=parseInt(this.value.slice(1),16)">
        </label>
      </div>
    </div>

    <div class="noct-sub">
      <button class="secondary" style="margin-bottom:12px" onclick="applyOceanPalette()">Apply Ocean Palette</button>
      <label style="color:#7bb">
        Wave base color
        <input name="color_wave" type="color" value="#0035d2"
               oninput="cfg.color_wave=parseInt(this.value.slice(1),16)">
      </label>
      <label style="color:#7bb;margin-bottom:0">
        Wave speed
        <select name="wave_speed" onchange="cfg.wave_speed=+this.value">
          <option value="0" selected>Slow</option>
          <option value="1">Normal</option>
          <option value="2">Fast</option>
        </select>
      </label>
    </div>
    <p class="hint" style="margin-top:10px">Prototype features — toggle individually to preview.</p>
  </section>

  <div style="display:flex;gap:8px">
    <button class="secondary" style="flex:1" onclick="copyConfig()">Copy Config JSON</button>
    <label style="flex:1;margin:0">
      <button class="secondary" style="width:100%" onclick="document.getElementById('import-file').click()">Import Config</button>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="importConfig(this)">
    </label>
  </div>
  <div id="copy-toast"></div>
</div>

<script>
// ── Config (mirrors DashConfig defaults) ─────────────────────────────────────
const cfg = {
  glucose_low: 70, glucose_high: 180, glucose_warn_low: 80, glucose_warn_high: 160,
  clock_24h: false, pulse_speed: 1, pulse_min: 50,
  wave_speed: 0, status_bar_style: 2,
  show_sparkline: true, sparkline_auto: false,
  sparkline_shadow: false, sparkline_fill: false,
  show_age: true, show_status_label: true, show_clock: true,
  show_stars: false,
  tide_strength: 75,
  color_low: 0xFF2200, color_warn: 0xFFCC00, color_ok: 0x00CC44,
  color_wave: 0x0035D2, color_wave2: 0x0a0020,
  color_boat_hull: 0xC87828, color_boat_sail: 0xAA8C3C,
};

const state = {
  value_mgdl: 112, trend_code: 4,
  stale: false, error: false, flipped: false,
  sparkline: [88,92,96,101,106,109,112,115,113,111,112,110,112],
};

// Noctiluca feature flags — keys match future DashConfig field names
const noct = {
  wave_enhanced: false,
  wave_tide:     false,
  stars_tint:    false,
  aurora:        false,
  boat_ride:     false,
  boat_duck:     false,
};

function setAllNoct(v) {
  Object.keys(noct).forEach(k => noct[k] = v);
  document.querySelectorAll('#noct-section input[type=checkbox]').forEach(cb => cb.checked = v);
  cfg.status_bar_style = v ? 0 : 2;
  cfg.show_stars = v;
  const waveEl = document.getElementById('n-show_wave');
  if (waveEl) waveEl.checked = v;
  const starsEl = document.getElementById('n-show_stars');
  if (starsEl) starsEl.checked = v;
  document.getElementById('tide-strength-row').style.display = v ? '' : 'none';
  document.getElementById('wave2-color-row').style.display   = v ? '' : 'none';
  document.getElementById('boat-colors-row').style.display   = v ? '' : 'none';
  if (v) applyOceanPalette();
}

function noctTideChanged(checked) {
  noct.wave_tide = checked;
  document.getElementById('tide-strength-row').style.display = checked ? '' : 'none';
}

function noctBoatChanged(checked) {
  noct.boat_ride = checked;
  document.getElementById('boat-colors-row').style.display = checked ? '' : 'none';
  syncBoatColorLabels();
}

function noctDuckChanged(checked) {
  noct.boat_duck = checked;
  if (checked) {
    cfg.color_boat_hull = 0xFFDD00;
    cfg.color_boat_sail = 0xFF7700;
    document.querySelector('[name=color_boat_hull]').value = '#ffdd00';
    document.querySelector('[name=color_boat_sail]').value = '#ff7700';
  }
  syncBoatColorLabels();
}

function syncBoatColorLabels() {
  const isDuck = noct.boat_duck;
  const hullLbl = document.getElementById('boat-hull-label');
  const sailLbl = document.getElementById('boat-sail-label');
  if (hullLbl) hullLbl.textContent = isDuck ? 'Body color' : 'Hull color';
  if (sailLbl) sailLbl.textContent = isDuck ? 'Beak color' : 'Sail color';
}

function applyOceanPalette() {
  cfg.color_low  = 0x8E0045; cfg.color_warn = 0x5386E4;
  cfg.color_ok   = 0x00E5CC; cfg.color_wave = 0x002080;
  document.querySelector('[name=color_low]').value  = '#8e0045';
  document.querySelector('[name=color_warn]').value = '#5386e4';
  document.querySelector('[name=color_ok]').value   = '#00e5cc';
  document.querySelector('[name=color_wave]').value = '#002080';
}

// ── Canvas setup ──────────────────────────────────────────────────────────────
const W = 128, H = 32;
const visible = document.getElementById('c');
const vctx = visible.getContext('2d');
vctx.imageSmoothingEnabled = false;
const off = document.createElement('canvas');
off.width = W; off.height = H;
const octx = off.getContext('2d');
let img = new ImageData(W, H);
let px  = img.data;

function setPixel(x, y, r, g, b) {
  if (x < 0 || x >= W || y < 0 || y >= H) return;
  const i = (y * W + x) << 2;
  px[i] = r; px[i+1] = g; px[i+2] = b; px[i+3] = 255;
}

function pxHash(x, row, tSlot) {
  let n = (Math.imul(x,1619) + Math.imul(row,31337) + Math.imul(tSlot,3571)) >>> 0;
  n ^= (n << 13); n = n >>> 0; n ^= (n >>> 17); n ^= (n << 5); n = n >>> 0;
  return (n & 0xFFFF) / 65535.0;
}

function unpack(rgb) { return [(rgb>>>16)&0xFF,(rgb>>>8)&0xFF,rgb&0xFF]; }

function valueColor(mgdl) {
  if (mgdl <= cfg.glucose_low  || mgdl >= cfg.glucose_high)         return unpack(cfg.color_low);
  if (mgdl <= cfg.glucose_warn_low || mgdl >= cfg.glucose_warn_high) return unpack(cfg.color_warn);
  return unpack(cfg.color_ok);
}

function drawLine(x1,y1,x2,y2,r,g,b) {
  let dx=Math.abs(x2-x1),dy=Math.abs(y2-y1),sx=x1<x2?1:-1,sy=y1<y2?1:-1,err=dx-dy;
  for(;;){setPixel(x1,y1,r,g,b);if(x1===x2&&y1===y2)break;
    const e2=2*err;if(e2>-dy){err-=dy;x1+=sx;}if(e2<dx){err+=dx;y1+=sy;}}
}

// ── Adafruit GFX 5×7 bitmap font ─────────────────────────────────────────────
const FONT = [
  0x00,0x00,0x00,0x00,0x00, 0x00,0x00,0x5F,0x00,0x00, 0x00,0x07,0x00,0x07,0x00,
  0x14,0x7F,0x14,0x7F,0x14, 0x24,0x2A,0x7F,0x2A,0x12, 0x23,0x13,0x08,0x64,0x62,
  0x36,0x49,0x55,0x22,0x50, 0x00,0x05,0x03,0x00,0x00, 0x00,0x1C,0x22,0x41,0x00,
  0x00,0x41,0x22,0x1C,0x00, 0x14,0x08,0x3E,0x08,0x14, 0x08,0x08,0x3E,0x08,0x08,
  0x00,0x50,0x30,0x00,0x00, 0x08,0x08,0x08,0x08,0x08, 0x00,0x60,0x60,0x00,0x00,
  0x20,0x10,0x08,0x04,0x02, 0x3E,0x51,0x49,0x45,0x3E, 0x00,0x42,0x7F,0x40,0x00,
  0x42,0x61,0x51,0x49,0x46, 0x21,0x41,0x45,0x4B,0x31, 0x18,0x14,0x12,0x7F,0x10,
  0x27,0x45,0x45,0x45,0x39, 0x3C,0x4A,0x49,0x49,0x30, 0x01,0x71,0x09,0x05,0x03,

function drawText(text, cx, cy, r, g, b, size) {
  const s = size || 1;
  let x = cx;
  for (let ci = 0; ci < text.length; ci++) {
    const code = text.charCodeAt(ci);
    if (code < 0x20 || code > 0x7E) { x += 6 * s; continue; }
    const base = (code - 0x20) * 5;
    for (let col = 0; col < 5; col++) {
      const bits = FONT[base + col];
      for (let row = 0; row < 7; row++) {
        if (bits & (1 << row)) {
          for (let sy = 0; sy < s; sy++)
            for (let sx = 0; sx < s; sx++)
              setPixel(x + col * s + sx, cy + row * s + sy, r, g, b);
        }
      }
    }
    x += 6 * s;
  }
}

// ── Stars ─────────────────────────────────────────────────────────────────────
const STAR_SLOT = 42;

function drawSparkles(t) {
  if (!cfg.show_stars) return;
  const [wr,wg,wb] = unpack(cfg.color_wave);
  for (let y = 1; y < 22; y++) {
    for (let x = 0; x < W; x++) {
      if (pxHash(x, y, STAR_SLOT) < 0.008) {
        const freq  = 0.002 + pxHash(x, y, STAR_SLOT+700) * 0.006;
        const phase = pxHash(x, y, STAR_SLOT+300) * 6.2832;
        const bright = 0.25 + 0.75 * (Math.sin(t * freq + phase) * 0.5 + 0.5);
        const v = Math.round(bright * 230);
        if (noct.stars_tint && y >= 17) {
          const tint = (y - 17) / 4.0 * 0.35;
          setPixel(x, y,
            Math.round(v*(1-tint) + wr*tint),
            Math.round(v*(1-tint) + wg*tint),
            Math.round(v*(1-tint) + wb*tint));
        } else {
          setPixel(x, y, v, v, v);
        }
      }
    }
  }
}

// ── Aurora ────────────────────────────────────────────────────────────────────
function drawAurora(t) {
  if (!noct.aurora) return;
  for (let x = 0; x < W; x++) {
    const b1 = Math.sin(x * 0.05 + t * 0.00007) * 0.5 + 0.5;
    const b2 = Math.sin(x * 0.09 - t * 0.00005 + 1.8) * 0.5 + 0.5;
    const band = b1 * 0.6 + b2 * 0.4;
    for (let y = 0; y < 22; y++) {
      const rowFade = y < 11 ? y / 11.0 : (21 - y) / 10.0;
      const intensity = Math.max(0, band * rowFade - 0.28);
      if (intensity > 0) {
        const v = Math.round(intensity * 22);
        setPixel(x, y, Math.round(v*0.2), Math.min(255,v), Math.min(255,Math.round(v*1.5)));
      }
    }
  }
}

// ── Wave strip ────────────────────────────────────────────────────────────────
// Draw a row of pixels with edge shading (first/last pixel at 40% brightness)
function drawShaded(xL, xR, y, r, g, b) {
  for (let x = xL; x <= xR; x++) {
    const dim = (x === xL || x === xR) ? 0.4 : 1.0;
    setPixel(x, y, Math.round(r*dim), Math.round(g*dim), Math.round(b*dim));
  }
}

function drawStatusBar(sr, sg, sb, t) {
  const WAVE_Y = 22, WAVE_H = 10;
  if (cfg.status_bar_style === 2) return;
  if (cfg.status_bar_style === 1) {
    for (let row = 0; row < WAVE_H; row++)
      for (let x = 0; x < W; x++)
        setPixel(x, WAVE_Y + row, sr, sg, sb);
    return;
  }

  const m = state.value_mgdl;
  const isAlert = m <= cfg.glucose_low  || m >= cfg.glucose_high;
  const isWarn  = m <= cfg.glucose_warn_low || m >= cfg.glucose_warn_high;

  let speedMult = cfg.wave_speed === 0 ? 0.5 : cfg.wave_speed === 2 ? 2.0 : 1.0;

  let amplitude = 1.5, baseline = 2.5;
  if (noct.wave_tide) {
    const s = cfg.tide_strength / 100;
    if (isAlert) {
      amplitude = 1.5 + (3.8 - 1.5) * s;
      baseline  = 2.5 + (3.2 - 2.5) * s;
      speedMult *= 1 + 0.8 * s;
    } else if (isWarn) {
      amplitude = 1.5 + (2.5 - 1.5) * s;
      baseline  = 2.5 + (2.8 - 2.5) * s;
      speedMult *= 1 + 0.3 * s;
    }
  }

  const t4 = Math.floor(t / 64);
  const wr=(cfg.color_wave>>>16)&0xFF, wg=(cfg.color_wave>>>8)&0xFF, wb=cfg.color_wave&0xFF;

  const surfaces = new Float32Array(W);
  for (let x = 0; x < W; x++) {
    const ft = t * 0.001 * speedMult;
    const wave = (Math.sin(x*0.130 - ft*3.00)
                + Math.sin(x*0.071 + ft*2.10) * 0.55
                + Math.sin(x*0.211 - ft*3.30) * 0.35
                + Math.sin(x*0.047 + ft*1.40) * 0.25) / 2.15;
    surfaces[x] = baseline + amplitude * wave;
  }

  const [d2r,d2g,d2b] = unpack(cfg.color_wave2);

  for (let x = 0; x < W; x++) {
    const surface = surfaces[x];
    for (let row = 0; row < WAVE_H; row++) {
      const d = row - surface;
      let bright = d < 0
        ? 0.03 + 0.25 * Math.exp(d * 2.5)
        : 0.12 + 0.58 * Math.exp(-d * 0.55);
      const nd = Math.abs(d);
      if (nd < 2.5) bright += (pxHash(x, row, t4) - 0.5) * 0.12 * (1.0 - nd * 0.4);
      bright = Math.max(0, Math.min(1, bright));
      let r = Math.round(wr * bright);
      let g = Math.round(wg * bright);
      let b = Math.min(255, Math.round(wb * bright + 18.0 * (1.0 - bright)));

      if (noct.wave_enhanced) {
        const depth = row / (WAVE_H - 1);
        r = Math.round(r * (1 - depth * 0.75) + d2r * depth);
        g = Math.round(g * (1 - depth * 0.85) + d2g * depth);
        b = Math.min(255, Math.round(b * (1 - depth * 0.2) + d2b * depth));
      }
      setPixel(x, WAVE_Y + row, r, g, b);
    }
  }

  // Boat or duck sprite bobbing on wave surface
  if (noct.boat_ride) {
    const bx = 62;
    const by = WAVE_Y + Math.floor(surfaces[bx]);
    const [hr,hg,hb] = unpack(cfg.color_boat_hull);
    const [saR,saG,saB] = unpack(cfg.color_boat_sail);

    if (noct.boat_duck) {
      // Duck: round body + head shifted right + beak pixel
      drawShaded(bx-2, bx+2, by,   hr, hg, hb);   // body base: 5px
      drawShaded(bx-3, bx+3, by-1, hr, hg, hb);   // body widest: 7px
      drawShaded(bx-2, bx+2, by-2, hr, hg, hb);   // body upper: 5px
      drawShaded(bx+1, bx+3, by-3, hr, hg, hb);   // neck/head base: 3px
      drawShaded(bx,   bx+3, by-4, hr, hg, hb);   // head: 4px
      setPixel(bx+4, by-3, saR, saG, saB);          // beak
      setPixel(bx+2, by-4, Math.round(hr/8), Math.round(hg/8), Math.round(hb/8)); // eye
    } else {
      // Sailboat: right-triangle sail (right side = mast) + raft at waterline
      drawShaded(bx-3, bx+3, by, hr, hg, hb);
      drawShaded(bx-2, bx+2, by-2, saR, saG, saB);
      drawShaded(bx, bx+2, by-3, saR, saG, saB);
      setPixel(bx+2, by-4, Math.round(saR*0.5), Math.round(saG*0.5), Math.round(saB*0.5));
    }
  }
}

// ── Trend arrows (CX = 42) ────────────────────────────────────────────────────
function drawTrendArrow(code, r, g, b) {
  const CX = 42, CY = 11;
  if (code === 1) {
    drawLine(CX-2,CY+4,CX-2,CY-4,r,g,b); drawLine(CX-2,CY-4,CX-4,CY-2,r,g,b);
    drawLine(CX-2,CY-4,CX,  CY-2,r,g,b);
    drawLine(CX+2,CY+4,CX+2,CY-4,r,g,b); drawLine(CX+2,CY-4,CX,  CY-2,r,g,b);
    drawLine(CX+2,CY-4,CX+4,CY-2,r,g,b); return;
  }
  if (code === 7) {
    drawLine(CX-2,CY-4,CX-2,CY+4,r,g,b); drawLine(CX-2,CY+4,CX-4,CY+2,r,g,b);
    drawLine(CX-2,CY+4,CX,  CY+2,r,g,b);
    drawLine(CX+2,CY-4,CX+2,CY+4,r,g,b); drawLine(CX+2,CY+4,CX,  CY+2,r,g,b);
    drawLine(CX+2,CY+4,CX+4,CY+2,r,g,b); return;
  }
  let x1,y1,x2,y2,hx1,hy1,hx2,hy2;
  switch(code){
    case 2:[x1,y1,x2,y2]=[CX,CY+4,CX,CY-4];     [hx1,hy1,hx2,hy2]=[CX-3,CY-1,CX+3,CY-1]; break;
    case 6:[x1,y1,x2,y2]=[CX,CY-4,CX,CY+4];     [hx1,hy1,hx2,hy2]=[CX-3,CY+1,CX+3,CY+1]; break;
    case 3:[x1,y1,x2,y2]=[CX-3,CY+3,CX+3,CY-3]; [hx1,hy1,hx2,hy2]=[CX,CY-3,CX+3,CY];     break;
    case 5:[x1,y1,x2,y2]=[CX-3,CY-3,CX+3,CY+3]; [hx1,hy1,hx2,hy2]=[CX,CY+3,CX+3,CY];     break;
    default:[x1,y1,x2,y2]=[CX-4,CY,CX+4,CY];    [hx1,hy1,hx2,hy2]=[CX+1,CY-3,CX+1,CY+3];
  }
  drawLine(x1,y1,x2,y2,r,g,b);
  drawLine(x2,y2,hx1,hy1,r,g,b);
  drawLine(x2,y2,hx2,hy2,r,g,b);
}

// ── Sparkline ─────────────────────────────────────────────────────────────────
function drawSparkline(spark) {
  if (!cfg.show_sparkline || spark.length === 0) return;
  const X0=88, Y0=2, HEIGHT=20, WIDTH=40, BAR_W=3;
  const count  = Math.min(spark.length, Math.floor(WIDTH/BAR_W));
  const startI = spark.length > count ? spark.length - count : 0;
  let lo=40, hi=400;
  if (cfg.sparkline_auto && count > 0) {
    let mn=spark[startI], mx=spark[startI];
    for(let i=startI+1;i<startI+count;i++){if(spark[i]<mn)mn=spark[i];if(spark[i]>mx)mx=spark[i];}
    const rng=Math.max(20,mx-mn), pad=Math.max(5,Math.floor(rng/5));
    lo=Math.max(40,mn-pad); hi=Math.min(400,mx+pad);
  }
  const yFor = v => Y0+HEIGHT-1-Math.round((Math.min(hi,Math.max(lo,v))-lo)/(hi-lo)*(HEIGHT-1));
  const pxFor = i => X0 + i * BAR_W + 1;

  for(let x=X0;x<X0+WIDTH;x++){
    setPixel(x,yFor(cfg.glucose_warn_low),40,40,40);
    setPixel(x,yFor(cfg.glucose_warn_high),40,40,40);
  }

  // Area fill: gradient from line color → wave color below each point
  if (cfg.sparkline_fill && count > 0) {
    const [fw,gw,bw] = unpack(cfg.color_wave);
    for (let i = 0; i < count; i++) {
      const x  = pxFor(i);
      const y  = yFor(spark[startI+i]);
      const [lr,lg,lb] = valueColor(spark[startI+i]);
      const maxDy = Y0+HEIGHT-1 - y;
      if (maxDy <= 0) continue;
      for (let dy = 1; dy <= maxDy; dy++) {
        const tv = dy / maxDy;
        const alpha = (1 - tv) * 0.14;
        setPixel(x, y+dy,
          Math.round((lr*(1-tv) + fw*tv) * alpha),
          Math.round((lg*(1-tv) + gw*tv) * alpha),
          Math.round((lb*(1-tv) + bw*tv) * alpha));
      }
    }
  }

  // Lines with optional drop shadow (y+1 at 25%)
  for (let i = 1; i < count; i++) {
    const x1=pxFor(i-1), y1=yFor(spark[startI+i-1]);
    const x2=pxFor(i),   y2=yFor(spark[startI+i]);
    const [r,g,b] = valueColor(spark[startI+i]);
    if (cfg.sparkline_shadow)
      drawLine(x1,y1+1,x2,y2+1,Math.round(r*0.25),Math.round(g*0.25),Math.round(b*0.25));
    drawLine(x1,y1,x2,y2,r,g,b);
  }
  if (count > 0) {
    const last=count-1, x=pxFor(last), y=yFor(spark[startI+last]);
    const [r,g,b]=valueColor(spark[startI+last]);
    setPixel(x,y,r,g,b);
  }
}

// ── Render loop ───────────────────────────────────────────────────────────────
const startTime = performance.now();
let lastFrame=0, fpsCount=0, fpsLast=performance.now();

function render(now) {
  requestAnimationFrame(render);
  if (now - lastFrame < 50) return;
  lastFrame = now;
  fpsCount++;
  if (now - fpsLast >= 1000) {
    document.getElementById('fps-ver').textContent = `fps: ${fpsCount}  ·  v20260512-5afcb13`;
    fpsCount=0; fpsLast=now;
  }
  const t = now - startTime;

  px.fill(0);
  for (let i=3; i<px.length; i+=4) px[i]=255;

  const mgdl       = state.value_mgdl;
  const [cr,cg,cb] = valueColor(mgdl);
  const alert      = mgdl <= cfg.glucose_low || mgdl >= cfg.glucose_high;
  const alertColor = unpack(cfg.color_low);

  drawAurora(t);
  drawSparkles(t);

  if (!state.error) {
    drawSparkline(state.sparkline);
    drawStatusBar(cr, cg, cb, t);
  } else {
    drawStatusBar(...alertColor, t);
  }

  if (!state.error) {
    // Compute pulsed color (used for both glucose number AND arrow)
    let [gr,gg,gb] = [cr,cg,cb];
    if (alert) {
      const pulseHz = [0.25, 0.5, 1.0][cfg.pulse_speed] ?? 0.5;
      const freq = pulseHz * 2 * Math.PI * 0.001;
      const minF = cfg.pulse_min / 100.0;
      const pulse = (1+minF)*0.5 + (1-minF)*0.5*Math.sin(t*freq);
      gr=Math.min(255,Math.round(cr*pulse));
      gg=Math.min(255,Math.round(cg*pulse));
      gb=Math.min(255,Math.round(cb*pulse));
    }

    // Arrow and glucose number share the same pulsed color
    drawTrendArrow(state.trend_code, gr, gg, gb);
    drawText(String(mgdl), 1, 3, gr, gg, gb, 2);

    if (cfg.show_age) drawText('5m', 71, 3, 160,160,160, 1);

    if (cfg.show_status_label) {
      if      (mgdl <= cfg.glucose_low)       drawText('LO',  71,13,255, 34,  0,1);
      else if (mgdl >= cfg.glucose_high)      drawText('HI',  71,13,255, 34,  0,1);
      else if (mgdl <= cfg.glucose_warn_low)  drawText('LO?', 71,13,255,204,  0,1);
      else if (mgdl >= cfg.glucose_warn_high) drawText('HI?', 71,13,255,204,  0,1);
    }

    if (cfg.show_clock) {
      if (state.stale) {
        drawText('STALE', 2, 24, 200,200,200, 1);
      } else {
        const d = new Date();
        let ts;
        if (cfg.clock_24h) {
          ts = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
        } else {
          const h = d.getHours()%12||12;
          ts = `${h}:${String(d.getMinutes()).padStart(2,'0')} ${d.getHours()<12?'AM':'PM'}`;
        }
        drawText(ts, 2, 24, 220,220,220, 1);
      }
    }
  } else {
    drawText('ERROR', 2, 24, 255,80,60, 1);
  }

  octx.putImageData(img, 0, 0);
  vctx.imageSmoothingEnabled = false;
  if (state.flipped) {
    vctx.save(); vctx.translate(768,192); vctx.rotate(Math.PI);
    vctx.drawImage(off,0,0,768,192); vctx.restore();
  } else {
    vctx.drawImage(off,0,0,768,192);
  }
}

requestAnimationFrame(render);

// ── UI handlers ───────────────────────────────────────────────────────────────
function onGlucoseRange(v) {
  state.value_mgdl=+v; document.getElementById('glucose-num').value=v; pushSparkline(+v);
}
function onGlucoseNum(v) {
  const c=Math.min(400,Math.max(40,+v||40)); state.value_mgdl=c;
  document.getElementById('glucose-range').value=c; pushSparkline(c);
}
function pushSparkline(v) {
  state.sparkline.push(v); if(state.sparkline.length>13) state.sparkline.shift();
}
function toggleState(key) {
  state[key]=!state[key];
  document.getElementById({stale:'t-stale',error:'t-error',flipped:'t-flip'}[key])
          .classList.toggle('on',state[key]);
}
function setPreset(mgdl,trend) {
  state.value_mgdl=mgdl; state.trend_code=trend; state.stale=false; state.error=false;
  document.getElementById('glucose-range').value=mgdl;
  document.getElementById('glucose-num').value=mgdl;
  document.getElementById('t-stale').classList.remove('on');
  document.getElementById('t-error').classList.remove('on');
  updateTrendButtons(); pushSparkline(mgdl);
}

    color_boat_hull:hex(cfg.color_boat_hull), color_boat_sail:hex(cfg.color_boat_sail),
    wave_enhanced:noct.wave_enhanced, wave_tide:noct.wave_tide,
    stars_tint:noct.stars_tint, aurora:noct.aurora, boat_ride:noct.boat_ride,
    boat_duck:noct.boat_duck,
  };
  navigator.clipboard.writeText(JSON.stringify(out,null,2)).catch(()=>{
    prompt('Copy this config JSON:',JSON.stringify(out,null,2));
  });
  const toast=document.getElementById('copy-toast');
  toast.textContent='Copied to clipboard!';
  setTimeout(()=>toast.textContent='',2000);
}

function importConfig(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = '';
  const reader = new FileReader();
  reader.onload = e => {
    let d;
    try { d = JSON.parse(e.target.result); } catch { alert('Invalid JSON file.'); return; }
    const hex2int = s => s ? parseInt(s.replace('#',''), 16) : undefined;
    Object.keys(cfg).forEach(k => {
      if (k.startsWith('color_')) {
        if (d[k] !== undefined) cfg[k] = hex2int(d[k]) ?? cfg[k];
      } else if (d[k] !== undefined) {
        cfg[k] = typeof cfg[k] === 'boolean' ? !!d[k] : +d[k] === +d[k] ? +d[k] : d[k];
      }
    });
    // Apply noct flags
    ['wave_enhanced','wave_tide','stars_tint','aurora','boat_ride','boat_duck'].forEach(k => {
      if (d[k] !== undefined) noct[k] = !!d[k];
      const el = document.getElementById('n-'+k);
      if (el) el.checked = noct[k];
    });
    syncBoatColorLabels();
    // Sync n-show_wave and n-show_stars from cfg
    const showWaveEl = document.getElementById('n-show_wave');
    if (showWaveEl) showWaveEl.checked = cfg.status_bar_style === 0;
    const showStarsEl = document.getElementById('n-show_stars');
    if (showStarsEl) showStarsEl.checked = cfg.show_stars;
    // Sync all named inputs
    document.querySelectorAll('[name]').forEach(el => {
      const k = el.name;
      if (!(k in cfg)) return;
      const v = cfg[k];
      if (el.type === 'checkbox')    el.checked = !!v;
      else if (el.type === 'color')  el.value = '#'+(v&0xFFFFFF).toString(16).padStart(6,'0');
      else if (el.tagName==='SELECT') el.value = String(v);
      else el.value = v;
    });
    // Conditional rows
    document.getElementById('tide-strength-row').style.display = noct.wave_tide ? '' : 'none';
    document.getElementById('wave2-color-row').style.display   = noct.wave_enhanced ? '' : 'none';
    document.getElementById('boat-colors-row').style.display   = noct.boat_ride ? '' : 'none';
    document.getElementById('tide-str-num').value = cfg.tide_strength;
    const toast = document.getElementById('copy-toast');
    toast.textContent = 'Config imported!';
    setTimeout(() => toast.textContent = '', 2000);
  };
  reader.readAsText(file);
}

// ── Trend buttons ─────────────────────────────────────────────────────────────
const TREND_LABELS = [
  [1,'↑↑ DblUp'],[2,'↑ SingleUp'],[3,'↗ 45Up'],[4,'→ Flat'],
  [5,'↘ 45Dn'],[6,'↓ SingleDn'],[7,'↓↓ DblDn'],[0,'? None'],
];
function updateTrendButtons() {
  document.querySelectorAll('.trend-btn').forEach(b=>
    b.classList.toggle('active',+b.dataset.code===state.trend_code));
}
const trendGrid=document.getElementById('trend-grid');
TREND_LABELS.forEach(([code,label])=>{
  const btn=document.createElement('button');
  btn.className='trend-btn'+(code===state.trend_code?' active':'');
  btn.dataset.code=code; btn.textContent=label;
  btn.onclick=()=>{state.trend_code=code;updateTrendButtons();};
  trendGrid.appendChild(btn);
});
</script>
