name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run

      - name: Build LittleFS filesystem image
        run: pio run --target buildfs

      - name: Copy artifacts to installer/
        run: |
          cp .pio/build/matrix-portal-s3/firmware.bin   installer/firmware.bin
          cp .pio/build/matrix-portal-s3/littlefs.bin   installer/littlefs.bin
          cp .pio/build/matrix-portal-s3/bootloader.bin installer/bootloader.bin
          cp .pio/build/matrix-portal-s3/partitions.bin installer/partitions.bin

      - name: Inject version into manifests and HTML
        run: |
          VERSION="$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          # Update manifest versions
          jq --arg v "$VERSION" '.version = $v' installer/manifest.json        > /tmp/m1.json && mv /tmp/m1.json installer/manifest.json
          jq --arg v "$VERSION" '.version = $v' installer/manifest-update.json > /tmp/m2.json && mv /tmp/m2.json installer/manifest-update.json

          # Stamp version placeholder in installer and sim pages
          sed -i "s/__VERSION__/$VERSION/g" installer/index.html
          sed -i "s/__VERSION__/$VERSION/g" sim/index.html

      - name: Commit updated installer binaries and stamped files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin \
            https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}
          git add installer/firmware.bin installer/littlefs.bin \
                  installer/bootloader.bin installer/partitions.bin \
                  installer/manifest.json installer/manifest-update.json \
                  installer/index.html sim/index.html
          git diff --cached --quiet \
            && echo "Nothing changed, skipping commit." \
            && exit 0
          git commit -m "ci: rebuild binaries v${VERSION} [skip ci]"
          git push origin HEAD:main

      - name: Stage Pages site (installer at root, sim at /sim/)
        run: |
          mkdir -p _site/sim
          cp -r installer/. _site/
          cp sim/index.html _site/sim/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
